<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enquire about our services, products, or sponsorship opportunities.">
    <title>Enquiry - Service Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="enquiry.html" class="active">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <h1>Service & Support Enquiry</h1>
        <form id="enquiryForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="enquiryType">Enquiry Subject:</label>
                <select id="enquiryType" name="enquiryType" required>
                    <option value="">--Select Option--</option>
                    <option value="service">Services / Products</option>
                    <option value="volunteer">Become a Volunteer</option>
                    <option value="sponsor">Sponsorship Opportunity</option>
                </select>
                <span class="error-message" id="typeError"></span>
            </div>

            <div class="form-group">
                <label for="message">Details / Requirements:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                <span class="error-message" id="messageError"></span>
            </div>

            <button type="submit">Submit Enquiry</button>
        </form>
        <div id="responseMessage" class="hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
