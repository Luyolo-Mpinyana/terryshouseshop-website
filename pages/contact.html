<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with our organization for general queries and feedback.">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container">
        <h1>Contact Us</h1>
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="contactName">Name:</label>
                <input type="text" id="contactName" name="contactName" required>
                <span class="error-message" id="contactNameError"></span>
            </div>

            <div class="form-group">
                <label for="contactEmail">Email:</label>
                <input type="email" id="contactEmail" name="contactEmail" required>
                <span class="error-message" id="contactEmailError"></span>
            </div>

            <div class="form-group">
                <label for="fullMessage">Your Message:</label>
                <textarea id="fullMessage" name="fullMessage" rows="5" required></textarea>
                <span class="error-message" id="fullMessageError"></span>
            </div>

            <button type="submit">Send Email</button>
        </form>
        <div id="contactResponse" class="hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
